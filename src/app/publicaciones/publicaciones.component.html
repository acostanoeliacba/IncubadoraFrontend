  <nav class="nav-links">
    <a href="#inicio">INICIO</a>
    <a [routerLink]="['/cursoDinamico']">CURSOS</a>
    <a href="#profesores">PROFESORES</a>
    <a href="#testimonios">TESTIMONIOS</a>

    <a [routerLink]="['/registro']">REGISTRARSE</a>
    <a [routerLink]="['/perfil']">PERFIL</a>
  </nav> 
</header>

<div class="contenedor">
  <h2>Noticias y Novedades</h2>

  <!-- Mensaje que indica si es docente o no -->
  <div *ngIf="esDocente; else noDocente" class="mensaje-docente">
    Estás logueado como <strong>Docente</strong>.
  </div>
  <ng-template #noDocente>
    <div class="mensaje-no-docente">
      No tienes permisos de docente.
    </div>
  </ng-template>

  <!-- Formulario solo visible si es docente -->
  <form *ngIf="esDocente"
        [formGroup]="publicacionForm"
        (ngSubmit)="crearPublicacion()"
        class="formulario"
        enctype="multipart/form-data">

    <label>Título:</label>
    <input formControlName="titulo" type="text" />

    <label>Contenido:</label>
    <textarea formControlName="contenido"></textarea>
    
    <label>Tipo:</label>
    <select formControlName="tipo">
      <option value="">-- Selecciona --</option>
      <option value="curso">Curso</option>
      <option value="capacitacion">Capacitación</option>
      <option value="entrenamiento">Entrenamiento</option>
    </select>

    <label>Estado:</label>
    <select formControlName="estado">
      <option value="">-- Selecciona --</option>
      <option value="activo">Activo</option>
      <option value="inactivo">Inactivo</option>
    </select>

    <button type="submit" [disabled]="publicacionForm.invalid">Crear Publicación</button>
  </form>

  <!-- Carrusel automático de publicaciones -->
  <div class="carousel-container" *ngIf="publicaciones.length">
    <div class="carousel-track" [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
      <div class="carousel-item" *ngFor="let pub of publicaciones">
        <h3>{{ pub.titulo }}</h3>
        <p>{{ pub.contenido }}</p>
        <div class="info">
          <span>{{ pub.tipo }}</span> | <span>{{ pub.estado }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<footer id="footer" class="footer">
  <div class="footer-content">
